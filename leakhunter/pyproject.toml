[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leakhunter"
version = "0.1.0"
description = "LeakHunter OpenEnv environment"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.7",
  "numpy>=1.26",
  "scipy>=1.11",
  "networkx>=3.2",
  "requests>=2.31",
  "openai>=1.30",
  "orjson>=3.10",
  "wntr>=1.3",
  "openenv-core>=0.2.0",
]

[project.scripts]
server = "server.app:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.setuptools]
package-dir = {"" = ".", "leakhunter" = ".", "leakhunter.server" = "server"}
packages = ["leakhunter", "leakhunter.server", "server"]
py-modules = ["client", "models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "performance: marks tests as performance benchmarks (deselect with '-m \"not performance\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"
